name: BitNet Moliere CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m compileall -q \
            model.py \
            train.py \
            sample.py \
            configurator.py \
            data/moliere/prepare.py \
            config/train_moliere_char.py
